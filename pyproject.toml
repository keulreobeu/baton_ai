[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baton-ai"
version = "0.1.0"
description = "BATON: provider-independent AI agent harness. Pass the task. Keep the progress."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gms = ["cryptography>=42"]

[project.scripts]
baton = "baton.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
