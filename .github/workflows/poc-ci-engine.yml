name: BATON CI engine cache PoC
on:
  push:
    branches: ['exp/ci-engine-poc-20261120']
permissions:
  contents: read
concurrency:
  group: ci-engine-poc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Push 2 diagnoses the disk cache corruption scenario only.
        os: [ubuntu-latest]
        scenario: [9]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare cached and uncached Bazel test results
        run: python -X utf8 poc/ci-engine/cache.py poc/ci-engine/evidence/cache --hosted --scenario ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-${{ matrix.os }}-${{ matrix.scenario }}
          path: poc/ci-engine/evidence/cache/
          if-no-files-found: error
