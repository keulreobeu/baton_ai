# CI-PAR-001 fixed pytest configuration for scripts/suite_backend.py (auxiliary, not official).
# Passed with -c; --rootdir, --noconftest, -p no:cacheprovider and the plugin list come from
# the tool's fixed argv. Defaults are kept so that pytest-only items (module-level test
# functions, non-TestCase Test* classes) are collected and then rejected by the ID comparison.
[pytest]
addopts =
python_files = test*.py
console_output_style = classic
xfail_strict = false
